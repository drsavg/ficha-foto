<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de parámetros fotográficos</title>
<meta name="theme-color" content="#0a3264">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/app-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ficha foto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#eef3f9; --card:#ffffff; --line:#dbe4ef;
  --navy:#0a2c57; --navy-2:#0a3264; --blue:#1f7ae0; --muted:#5d6e84;
  --mine:#e0670c; --mine-bg:#fff3e8;
  --r:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* Encabezado */
.band{background:linear-gradient(160deg,#0d3d78,#082a52);color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 0 18px}
.band .wrap{display:flex;align-items:center;gap:12px}
.band .logo{flex:0 0 auto;width:48px;height:48px;border:0;padding:0;background:none;border-radius:50%}
.band .logo img{width:100%;height:100%;display:block}
.band h1{min-width:0;font-size:18px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.01em}

.banner{margin:12px 0 0;background:#fff8e6;border:1px solid #f1d699;color:#5a4304;border-radius:12px;
  padding:10px 12px;font-size:13.5px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}
.banner .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;padding:0 2px;color:#8a6a1a}
.banner .act{border:0;background:var(--navy-2);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:650;white-space:nowrap}

/* Controles */
.controls{display:grid;gap:8px;margin:14px 0 0}
@media (min-width:560px){.controls{grid-template-columns:1fr 1.3fr}}
.seg{display:flex;background:#dfe8f3;border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-size:14.5px;font-weight:650;
  color:#36506f;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.seg button img{width:22px;height:22px}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:#fff;box-shadow:0 1px 3px rgba(10,44,87,.3)}

/* Tarjeta del estudiante */
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(10,44,87,.06),0 4px 14px rgba(10,44,87,.06)}
.student{margin-top:12px;padding:12px 14px 14px}
input.t{width:100%;font:inherit;font-size:16px;font-weight:600;padding:8px 10px;border:1.5px solid #d5e0ed;border-radius:10px;
  background:#f8fbff;color:var(--navy);outline:none;min-width:0}
input.t::placeholder{color:#a3b1c3;font-weight:500}
input.t:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(31,122,224,.15)}
input.t.name{font-size:20px;font-weight:780;letter-spacing:-.01em;padding:9px 11px}
input.t.bad{border-color:#d33;box-shadow:0 0 0 3px rgba(221,51,51,.15)}
.err{color:#c62828;font-size:13px;font-weight:650;margin:5px 2px 0}
.err[hidden]{display:none}
.student .eq{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;margin-top:10px}
.student .eq label{font-size:13.5px;font-weight:650;color:var(--muted)}

.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:12px 2px 0;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Secciones */
h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  margin:20px 2px 10px;color:var(--navy)}
h2 .ic{width:34px;height:34px}
h2 .chip{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;color:#fff;
  background:var(--navy-2);border-radius:999px;padding:4px 10px}

.ic{border:0;padding:0;background:none;border-radius:50%;display:block;flex:0 0 auto;position:relative}
.ic img{width:100%;height:100%;display:block;pointer-events:none}
.ic:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Grid cámara */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{padding:10px 5px 10px;text-align:center;display:flex;flex-direction:column;align-items:center}
.tile .ic{width:54px;height:54px}
.tile .lbl{font-size:11.5px;line-height:1.2;color:var(--muted);font-weight:650;margin-top:6px;min-height:28px;
  display:flex;align-items:center;justify-content:center}
.tile[hidden]{display:none}

.val{width:100%;margin-top:3px}
.rec{font-size:15.5px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.rec.na{font-size:12.5px;font-weight:600;color:#9aa9bc}
.rec.long{font-size:13.5px;letter-spacing:-.01em}
body:not(.editing) .val.hasmine .rec.na{display:none}
.mine{margin-top:4px;font-size:14.5px;font-weight:800;line-height:1.2;color:var(--mine);background:var(--mine-bg);
  border-radius:7px;padding:2px 5px;display:inline-block;max-width:100%;word-break:break-word}
.mine:empty{display:none}
.editing .mine{display:none}
.edit{display:none;position:relative;margin-top:5px;width:100%}
.editing .edit{display:block}
.edit input{width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--mine);padding:6px 7px;
  border:1.5px solid #f0c9a6;border-radius:9px;background:#fffaf5;outline:none;text-align:center}
.edit input::placeholder{color:#d8b393;font-weight:600;font-size:12.5px}
.val.hasmine .edit input{padding-right:26px}
.edit input:focus{border-color:var(--mine);box-shadow:0 0 0 3px rgba(224,103,12,.15)}
.rst{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:24px;height:28px;border:0;background:none;
  padding:0;display:flex;align-items:center;justify-content:center;color:var(--mine)}
.rst svg{width:16px;height:16px}
.rst[hidden]{display:none}

/* Tabla tomas */
.tomas{display:grid;grid-template-columns:minmax(84px,1.2fr) repeat(3,minmax(0,1fr));padding:6px 8px 4px}
.tomas .hd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 8px;font-size:11px;
  font-weight:700;color:var(--muted);text-align:center;border-bottom:1.5px solid var(--line)}
.tomas .hd .ic{width:44px;height:44px}
.tomas .grp{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--blue);padding:12px 4px 4px}
.tomas .tl,.tomas .cell{padding:9px 3px;border-bottom:1px solid var(--line)}
.tomas .tl{font-size:14px;font-weight:750;line-height:1.2;padding-left:4px}
.tomas .tl small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.tomas .cell{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tomas .last{border-bottom:0}
.tomas .rec{font-size:15px}

@keyframes pulse{0%{background:#cfe3fb}100%{background:transparent}}
.pulse{animation:pulse 1.1s ease-out;border-radius:6px}

footer{text-align:center;color:#8394aa;font-size:12px;margin:22px 0 10px}

/* Barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}
.bar .wrap{display:flex;gap:10px;padding:0;max-width:728px}
.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;font-size:15.5px;font-weight:750;display:flex;
  align-items:center;justify-content:center;gap:8px}
.btn svg{width:19px;height:19px}
.btn.sec{background:#e3ebf5;color:var(--navy)}
.btn.pri{background:var(--navy-2);color:#fff}
.editing .btn#bEdit{background:var(--mine);color:#fff}

/* Ventana de ayuda */
#pop{position:absolute;z-index:30;width:min(290px,calc(100vw - 24px));background:var(--navy);color:#fff;
  border-radius:12px;padding:12px 38px 12px 14px;font-size:14px;line-height:1.4;box-shadow:0 10px 30px rgba(5,25,55,.35)}
#pop[hidden]{display:none}
#pop b{display:block;font-size:14.5px;margin-bottom:3px}
#pop .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border:0;background:rgba(255,255,255,.12);
  border-radius:8px;color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
#pop .arrow{position:absolute;width:14px;height:14px;background:var(--navy);transform:rotate(45deg)}

/* Exportar */
#modal{position:fixed;inset:0;z-index:40;background:rgba(6,22,44,.55);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#modal .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;display:flex;flex-direction:column;gap:12px}
#modal .prev{flex:1;min-height:0;overflow:auto;background:var(--bg);border-radius:12px;padding:8px;text-align:center}
#modal .prev img{width:100%;max-width:340px;border-radius:8px;box-shadow:0 2px 10px rgba(10,44,87,.15)}
#modal .row{display:flex;gap:10px}
#modal .msg{font-size:13px;color:var(--muted);text-align:center;min-height:16px}
@media (min-width:600px){#modal{align-items:center}#modal .sheet{border-radius:18px}}
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <button class="logo ic" data-info="triangulo" aria-label="Triángulo de la exposición: información"><img data-icon="triangulo" alt=""></button>
    <h1>Ficha de parámetros fotográficos</h1>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Sensor">
      <button data-sensor="ff">Full frame</button>
      <button data-sensor="apsc">APS-C</button>
    </div>
    <div class="seg" role="group" aria-label="Tipo de cámara">
      <button data-tipo="reflex"><img data-icon="reflex" alt="">Réflex</button>
      <button data-tipo="mirrorless"><img data-icon="mirrorless" alt="">Mirrorless</button>
    </div>
  </div>

  <section class="card student" aria-label="Tus datos">
    <input class="t name" id="fNombre" data-h="nombre" placeholder="Tu nombre" autocomplete="name" maxlength="80" aria-label="Nombre">
    <div class="err" id="errNombre" hidden>Escribe tu nombre para exportar.</div>
    <div class="eq">
      <label for="fCamara">Cámara</label><input class="t" id="fCamara" data-h="camara" placeholder="Modelo" maxlength="80">
      <label for="fLente">Lente</label><input class="t" id="fLente" data-h="lente" placeholder="Modelo" maxlength="80">
      <label for="fFlash">Flash</label><input class="t" id="fFlash" data-h="flash" placeholder="Modelo (si usas)" maxlength="80">
    </div>
  </section>

  <div class="legend"><span><i style="background:var(--navy)"></i>Recomendado</span><span><i style="background:var(--mine)"></i>Mi valor</span></div>

  <h2>Cámara</h2>
  <section class="grid" id="gCam"></section>

  <h2><button class="ic" data-info="estandarizacion" aria-label="Estandarización: información"><img data-icon="estandarizacion" alt=""></button>Tomas<span class="chip" id="chipSensor"></span></h2>
  <section class="card tomas" id="gTomas"></section>

  <footer id="foot"></footer>
</main>

<nav class="bar">
  <div class="wrap">
    <button class="btn sec" id="bEdit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>Editar</span>
    </button>
    <button class="btn pri" id="bExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span>Exportar</span>
    </button>
  </div>
</nav>

<div id="pop" role="dialog" aria-live="polite" hidden><div class="arrow"></div><b></b><span></span><button class="x" aria-label="Cerrar">×</button></div>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-label="Exportar ficha">
    <div class="prev"><img id="mImg" alt="Vista previa de la ficha"></div>
    <div class="msg" id="mMsg"></div>
    <div class="row">
      <button class="btn sec" id="mPng">Guardar imagen</button>
      <button class="btn pri" id="mPdf">Guardar PDF</button>
    </div>
    <button class="btn sec" id="mClose">Cerrar</button>
  </div>
</div>

/* ===================== ESTADO ===================== */
const KEY = 'fichaFotoOdonto:v1';
const KEY_PENDING = 'fichaFotoOdonto:v1:pendiente';
const KEY_BANNER = 'fichaFotoOdonto:v1:banner';
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
function uid(){
  try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
let S = (()=>{ try{ return JSON.parse(store.get(KEY)) || null; }catch(e){ return null; } })();
S = Object.assign({id:uid(), nombre:'', camara:'', lente:'', flash:'', sensor:'ff', tipo:'', mine:{}}, S || {});
if(!S.mine || typeof S.mine !== 'object') S.mine = {};
if(!SENSOR_NAME[S.sensor]) S.sensor = 'ff';


let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>store.set(KEY, JSON.stringify(S)), 200); }
function saveNow(){ clearTimeout(saveT); store.set(KEY, JSON.stringify(S)); }
save();

/* ===================== UTILIDADES DOM ===================== */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v == null || v === false) continue;
    if(k === 'class') n.className = v; else if(k === 'text') n.textContent = v; else n.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids) if(c != null) n.append(c);
  return n;
};
const RESET_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';

function iconBtn(icon, info, label){
  const b = el('button', {class:'ic', 'data-info':info, 'aria-label':label + ': información'});
  b.append(el('img', {src:ICONS[icon], alt:''}));
  return b;
}
function valueBlock(key, recText, depKey, naText){
  const v = el('div', {class:'val' + (S.mine[key] ? ' hasmine' : '')});
  const rec = el('div', {class:'rec' + (recText ? (recText.length >= 12 ? ' long' : '') : ' na'), 'data-dep':depKey || null, text: recText || naText || NA});
  const mine = el('div', {class:'mine', 'data-mine':key, text: S.mine[key] || ''});
  const inp = el('input', {'data-k':key, placeholder:'Mi valor', maxlength:'40', enterkeyhint:'done', 'aria-label':'Mi valor'});
  inp.value = S.mine[key] || '';
  const rst = el('button', {class:'rst', 'data-r':key, 'aria-label':'Restablecer este valor', title:'Restablecer', hidden: !S.mine[key]});
  rst.innerHTML = RESET_SVG;
  v.append(rec, mine, el('div', {class:'edit'}, inp, rst));
  return v;
}

/* ===================== RENDER ===================== */
function renderStudent(){
  document.querySelectorAll('[data-h]').forEach(i => { if(document.activeElement !== i) i.value = S[i.dataset.h] || ''; });
}

function renderCam(){
  const g = $('#gCam'); g.textContent = '';
  for(const it of CAMARA){
    const t = el('div', {class:'card tile', 'data-id':it.id});
    if(it.only && S.tipo !== it.only) t.hidden = true;
    t.append(iconBtn(it.icon, it.id, it.label), el('div', {class:'lbl', text:it.label}), valueBlock('cam.'+it.id, it.rec));
    g.append(t);
  }
}

function renderTomas(){
  const g = $('#gTomas'); g.textContent = '';
  g.append(el('div', {class:'hd'}));
  for(const c of COLS){ const h = el('div', {class:'hd'}); h.append(iconBtn(c.icon, c.id, c.label), document.createTextNode(c.label)); g.append(h); }
  TOMAS.forEach((grp, gi) => {
    g.append(el('div', {class:'grp', text:grp.grupo}));
    grp.items.forEach((t, ti) => {
      const last = gi === TOMAS.length-1 && ti === grp.items.length-1 ? ' last' : '';
      const tl = el('div', {class:'tl'+last}, t.label); if(t.sub) tl.append(el('small', {text:t.sub}));
      g.append(tl);
      for(const c of COLS){
        const recText = t[c.id] ? t[c.id][S.sensor] : null;
        const cell = el('div', {class:'cell'+last});
        cell.append(valueBlock('toma.'+t.id+'.'+c.id, recText, t[c.id] ? t.id+'.'+c.id : null, '—'));
        g.append(cell);
      }
    });
  });
  $('#chipSensor').textContent = SENSOR_NAME[S.sensor];
}

function renderToggles(){
  document.querySelectorAll('[data-sensor]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sensor === S.sensor)));
  document.querySelectorAll('[data-tipo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tipo === S.tipo)));
  document.querySelectorAll('.tile[data-id]').forEach(t => {
    const it = CAMARA.find(x => x.id === t.dataset.id);
    t.hidden = !!(it.only && S.tipo !== it.only);
  });
}

function applySensor(){
  for(const grp of TOMAS) for(const t of grp.items) for(const c of COLS){
    if(!t[c.id]) continue;
    const n = document.querySelector('.rec[data-dep="'+t.id+'.'+c.id+'"]');
    if(!n) continue;
    const nv = t[c.id][S.sensor];
    if(n.textContent !== nv){ n.textContent = nv; n.classList.toggle('long', nv.length >= 12); n.classList.remove('pulse'); void n.offsetWidth; n.classList.add('pulse'); }
  }
  $('#chipSensor').textContent = SENSOR_NAME[S.sensor];
}

// Reduce la letra de un valor recomendado si no cabe en su celda (pantallas angostas)
function fitRecs(){
  document.querySelectorAll('.rec').forEach(n => {
    n.style.fontSize = '';
    if(!n.offsetParent) return;
    let fs = parseFloat(getComputedStyle(n).fontSize), guard = 0;
    while(n.scrollWidth > n.clientWidth + 0.5 && fs > 11 && guard++ < 12){ fs -= 0.5; n.style.fontSize = fs + 'px'; }
  });
}

$('#foot').textContent = 'Versión ' + CONFIG.VERSION + ' · ' + CONFIG.FECHA;
document.querySelectorAll('img[data-icon]').forEach(i => { i.src = ICONS[i.dataset.icon]; });
renderStudent(); renderCam(); renderTomas(); renderToggles(); fitRecs();
window.addEventListener('resize', () => { clearTimeout(window.__fitT); window.__fitT = setTimeout(fitRecs, 120); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitRecs);

/* ===================== EVENTOS ===================== */
document.addEventListener('click', e => {
  const s = e.target.closest('[data-sensor]');
  if(s){ if(S.sensor !== s.dataset.sensor){ S.sensor = s.dataset.sensor; save(); renderToggles(); applySensor(); fitRecs(); } return; }
  const tp = e.target.closest('[data-tipo]');
  if(tp){ S.tipo = tp.dataset.tipo; save(); renderToggles(); fitRecs(); return; }
  const r = e.target.closest('[data-r]');
  if(r){
    const k = r.dataset.r; delete S.mine[k]; save();
    const inp = document.querySelector('input[data-k="'+k+'"]'); if(inp) inp.value = '';
    const m = document.querySelector('[data-mine="'+k+'"]'); if(m) m.textContent = '';
    r.hidden = true; r.closest('.val').classList.remove('hasmine');
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.k){
    const k = t.dataset.k, v = t.value.trim();

/* ===================== EXPORTAR (imagen + PDF) ===================== */
const FF = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const C = {bg:'#eef3f9', navy:'#0a2c57', muted:'#5d6e84', line:'#dbe4ef', blue:'#1f7ae0', mine:'#e0670c', mineBg:'#fff3e8', na:'#9aa9bc'};
const IMG = {};
function loadIcon(name){
  if(IMG[name]) return IMG[name];
  IMG[name] = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = ICONS[name]; });
  return IMG[name];
}
function rrect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function setFont(ctx, px, w){ ctx.font = (w || 600) + ' ' + px + 'px ' + FF; }
function wrapLines(ctx, text, maxW){
  const out = []; let cur = '';
  const pushWord = w => {
    if(ctx.measureText(w).width <= maxW){ cur = w; return; }
    let part = '';
    for(const ch of w){ if(ctx.measureText(part+ch).width > maxW && part){ out.push(part); part = ch; } else part += ch; }
    cur = part;
  };
  for(const w of String(text).split(/\s+/).filter(Boolean)){
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width <= maxW) cur = test;
    else { if(cur) out.push(cur); pushWord(w); }
  }
  if(cur) out.push(cur);
  return out.length ? out : [''];
}
// Dibuja texto envuelto; devuelve la altura usada.
function textAt(ctx, text, x, y, maxW, px, weight, color, align, draw){
  setFont(ctx, px, weight); const lines = wrapLines(ctx, text, maxW); const lh = Math.round(px*1.22);
  if(draw){ ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
    lines.forEach((l,i) => ctx.fillText(l, align === 'center' ? x + maxW/2 : x, y + i*lh)); }
  return lines.length * lh;
}
// Ajusta el tamaño de letra para que el texto quepa en una línea (hasta un mínimo).
function fitSize(ctx, text, maxW, px, weight, minPx){
  setFont(ctx, px, weight);
  while(px > minPx && ctx.measureText(text).width > maxW){ px -= 0.25; setFont(ctx, px, weight); }
  return px;
}
function ellipsize(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return text;
  let t = text; while(t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
// Bloque valor: recomendado + mi valor. Devuelve altura.
function valueAt(ctx, rec, mine, x, y, w, draw, s, naText, align){
  align = align || 'center';
  let h = 0;
  if(rec){
    const px = fitSize(ctx, rec, w, s.rec, 800, s.min);
    h += textAt(ctx, rec, x, y, w, px, 800, C.navy, align, draw);
  } else if(!mine) h += textAt(ctx, naText || NA, x, y + 1, w, s.na, 600, C.na, align, draw) + 1;
  if(mine){
    if(h) h += 2.5;
    const px = fitSize(ctx, mine, w - 10, s.mine, 800, s.min);
    const lines = wrapLines(ctx, mine, w - 10); const lh = Math.round(px * 1.22 * 4) / 4;
    const bw = Math.min(w, Math.max(...lines.map(l => ctx.measureText(l).width)) + 10), bh = lines.length * lh + 4;
    const bx = align === 'center' ? x + (w - bw) / 2 : x;
    if(draw){ rrect(ctx, bx, y + h, bw, bh, 4); ctx.fillStyle = C.mineBg; ctx.fill(); }
    if(align === 'center') textAt(ctx, mine, x + 5, y + h + 2, w - 10, px, 800, C.mine, 'center', draw);
    else textAt(ctx, mine, bx + 5, y + h + 2, bw - 10, px, 800, C.mine, 'left', draw);
    h += bh;
  }
  return h;
}

// Ficha compacta, pensada para verse completa en la pantalla de un teléfono.
// Unidades = puntos de pantalla de un teléfono de 390 de ancho.
const EXP_W = 390;
async function drawSheet(ctx, draw){
  const W = EXP_W, P = 10, G = 6; let y = 0;
  const icons = {}; for(const n of ['triangulo','estandarizacion', ...CAMARA.map(c => c.icon), ...COLS.map(c => c.icon)]) icons[n] = await loadIcon(n);
  const img = (n, x, yy, s) => { if(draw && icons[n]) ctx.drawImage(icons[n], x, yy, s, s); };
  const txt = (t, x, yy, px, w, color, align, base) => { setFont(ctx, px, w);
    if(draw){ ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'top'; ctx.fillText(t, x, yy); }
    return ctx.measureText(t).width; };
  const chipW = t => { setFont(ctx, 9.5, 700); return ctx.measureText(t).width + 14; };
  const chipC = (t, x, yy, filled) => { const w = chipW(t), h = 17;
    if(draw){ rrect(ctx, x, yy, w, h, 8.5);
      if(filled){ ctx.fillStyle = '#0a3264'; ctx.fill(); } else { ctx.strokeStyle = '#0a3264'; ctx.lineWidth = 1.1; ctx.stroke(); }
      setFont(ctx, 9.5, 700); ctx.fillStyle = filled ? '#fff' : '#0a3264'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, x + 7, yy + h/2 + 0.5); }
    return w; };

  if(draw){ ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, ctx.canvas.height); }

  // Banda
  const bandH = 42;
  if(draw){ const g = ctx.createLinearGradient(0, 0, W, bandH); g.addColorStop(0, '#0d3d78'); g.addColorStop(1, '#082a52'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, bandH); }
  img('triangulo', P, 5, 32);
  txt('Ficha de parámetros fotográficos', P + 32 + 9, bandH/2 + 0.5, 14.5, 800, '#ffffff', 'left', 'middle');
  y = bandH + 7;

  // Datos del estudiante en flujo continuo (salta de línea al llegar al borde)
  const cardX = P, cardW = W - 2*P, pad = 9, innerW = cardW - 2*pad, LH = 20;
  const tokens = [{k:'name', t:S.nombre || '—'}];
  for(const [lab, val] of [['Cámara', S.camara], ['Lente', S.lente], ['Flash', S.flash]]) if(val) tokens.push({k:'pair', l:lab, t:val});
  tokens.push({k:'chip', t:SENSOR_NAME[S.sensor], f:true});
  if(TIPO_NAME[S.tipo]) tokens.push({k:'chip', t:TIPO_NAME[S.tipo], f:false});
  const tokW = tk => {
    if(tk.k === 'name'){ setFont(ctx, 15, 800); tk.t = ellipsize(ctx, tk.t, innerW); return ctx.measureText(tk.t).width; }
    if(tk.k === 'pair'){ setFont(ctx, 9.5, 650); const lw = ctx.measureText(tk.l).width; setFont(ctx, 11.5, 700);
      tk.t = ellipsize(ctx, tk.t, innerW - lw - 4); tk.lw = lw; return lw + 4 + ctx.measureText(tk.t).width; }
    return chipW(tk.t);
  };
  const flow = (yy, d) => {
    let x = cardX + pad, line = 0;
    tokens.forEach((tk, i) => {
      const w = tokW(tk);
      if(i > 0 && x + w > cardX + pad + innerW + 0.5){ line++; x = cardX + pad; }
      const top = yy + line * LH, base = top + 14.5;
      if(d){
        if(tk.k === 'name'){ setFont(ctx, 15, 800); ctx.fillStyle = C.navy; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(tk.t, x, base); }
        else if(tk.k === 'pair'){ setFont(ctx, 9.5, 650); ctx.fillStyle = C.muted; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(tk.l, x, base);
          setFont(ctx, 11.5, 700); ctx.fillStyle = C.navy; ctx.fillText(tk.t, x + tk.lw + 4, base); }
        else chipC(tk.t, x, top + 2, tk.f);
      }
      x += w + (tk.k === 'chip' ? 5 : 12);
    });
    return (line + 1) * LH;
  };
  const cardH = flow(0, false) + 2*pad - 3;
  if(draw){ rrect(ctx, cardX, y, cardW, cardH, 10); ctx.fillStyle = '#fff'; ctx.fill(); }
  flow(y + pad - 1, draw);
  y += cardH + 9;

  // Encabezado CÁMARA + leyenda
  txt('CÁMARA', P + 2, y, 11, 800, C.navy);
  setFont(ctx, 8.5, 650);
  const lw1 = ctx.measureText('Recomendado').width, lw2 = ctx.measureText('Mi valor').width;
  let lx = W - P - (lw1 + lw2 + 2*11 + 10);
  const leg = (x, color, t) => { if(draw){ rrect(ctx, x, y + 1.5, 7.5, 7.5, 2); ctx.fillStyle = color; ctx.fill(); } return txt(t, x + 11, y + 0.5, 8.5, 650, C.muted) + 11; };
  lx += leg(lx, C.navy, 'Recomendado') + 10; leg(lx, C.mine, 'Mi valor');
  y += 17;

  // Grid cámara: 3 columnas, ícono a la izquierda
  const items = CAMARA.filter(it => !it.only || S.tipo === it.only);
  const cols = 3, cw3 = (W - 2*P - G*(cols - 1)) / cols, IC = 27, tp = 5.5;
  const tx0 = tp + IC + 5, txw = cw3 - tx0 - 4;
  const sCam = {rec:12.5, mine:11, na:9, min:9.5};
  const tileBody = (it, x, yy, d) => {
    let h = textAt(ctx, it.label, x + tx0, yy, txw, 8.5, 650, C.muted, 'left', d) + 1;
    h += valueAt(ctx, it.rec, S.mine['cam.' + it.id], x + tx0, yy + h, txw, d, sCam, NA, 'left');
    return h;
  };
  for(let i = 0; i < items.length; i += cols){
    const row = items.slice(i, i + cols);
    const rh = Math.max(...row.map(it => Math.max(IC, tileBody(it, 0, 0, false)) + 2*tp));
    row.forEach((it, j) => {
      const x = P + j*(cw3 + G);
      if(draw){ rrect(ctx, x, y, cw3, rh, 8); ctx.fillStyle = '#fff'; ctx.fill(); }
      img(it.icon, x + tp, y + tp, IC);
      tileBody(it, x, y + tp, draw);
    });
    y += rh + 5;
  }
  y += 5;

  // TOMAS
  img('estandarizacion', P, y - 3, 18);
  txt('TOMAS', P + 23, y, 11, 800, C.navy);
  chipC(SENSOR_NAME[S.sensor], W - P - chipW(SENSOR_NAME[S.sensor]), y - 3.5, true);
  y += 18;
  const tX = P, tW = W - 2*P, ip = 6, c0 = 98, cw = (tW - 2*ip - c0) / 3;
  const sT = {rec:13, mine:11, na:11, min:9.5};
  const rowsH = [];
  for(const grp of TOMAS) for(const t of grp.items){
    let lh = textAt(ctx, t.label, 0, 0, c0 - 6, 10.5, 750, C.navy, 'left', false);
    if(t.sub) lh += textAt(ctx, t.sub, 0, 0, c0 - 6, 8.5, 600, C.muted, 'left', false);
    let vh = 0;
    for(const c of COLS){ const rec = t[c.id] ? t[c.id][S.sensor] : null; vh = Math.max(vh, valueAt(ctx, rec, S.mine['toma.' + t.id + '.' + c.id], 0, 0, cw - 6, false, sT, '—')); }
    rowsH.push(Math.max(lh, vh) + 10);
  }
  const headH = 4 + 22 + 2 + 11 + 3, grpH = 15;
  const tY0 = y, tableH = 3 + headH + TOMAS.length*grpH + rowsH.reduce((a, b) => a + b, 0) + 2;
  if(draw){ rrect(ctx, tX, tY0, tW, tableH, 10); ctx.fillStyle = '#fff'; ctx.fill(); }
  y = tY0 + 3;
  COLS.forEach((c, i) => {
    const x = tX + ip + c0 + i*cw;
    img(c.icon, x + (cw - 22)/2, y + 4, 22);
    textAt(ctx, c.label, x, y + 4 + 22 + 2, cw, 8.5, 700, C.muted, 'center', draw);
  });
  y += headH;
  if(draw){ ctx.fillStyle = C.line; ctx.fillRect(tX + ip, y - 1, tW - 2*ip, 1.2); }
  let ri = 0;
  for(const grp of TOMAS){
    setFont(ctx, 8.5, 800);
    if(draw){ ctx.fillStyle = C.blue; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(grp.grupo.toUpperCase().split('').join(String.fromCharCode(8202)), tX + ip + 2, y + 5); }
    y += grpH;
    grp.items.forEach((t, ti) => {
      const rh = rowsH[ri++];
      let lh = textAt(ctx, t.label, 0, 0, c0 - 6, 10.5, 750, C.navy, 'left', false);
      if(t.sub) lh += textAt(ctx, t.sub, 0, 0, c0 - 6, 8.5, 600, C.muted, 'left', false);
      let ly = y + (rh - lh)/2;
      ly += textAt(ctx, t.label, tX + ip + 2, ly, c0 - 6, 10.5, 750, C.navy, 'left', draw);
      if(t.sub) textAt(ctx, t.sub, tX + ip + 2, ly, c0 - 6, 8.5, 600, C.muted, 'left', draw);
      COLS.forEach((c, i) => {
        const rec = t[c.id] ? t[c.id][S.sensor] : null;
        const mine = S.mine['toma.' + t.id + '.' + c.id];
        const x = tX + ip + c0 + i*cw;
        const vh = valueAt(ctx, rec, mine, x + 3, 0, cw - 6, false, sT, '—');
        valueAt(ctx, rec, mine, x + 3, y + (rh - vh)/2, cw - 6, draw, sT, '—');
      });
      y += rh;
      if(draw && ti < grp.items.length - 1){ ctx.fillStyle = C.line; ctx.fillRect(tX + ip, y - 0.5, tW - 2*ip, 0.8); }
    });
  }
  y = tY0 + tableH + 7;

  // Pie
  const hoy = new Date(); const dd = String(hoy.getDate()).padStart(2, '0'), mm = String(hoy.getMonth() + 1).padStart(2, '0');
  txt('Versión ' + CONFIG.VERSION + ' · ' + CONFIG.FECHA + '  ·  Exportada ' + dd + '-' + mm + '-' + hoy.getFullYear(), W/2, y, 8, 600, '#8394aa', 'center');
  return y + 17;
}

async function buildCanvas(){
  const W = EXP_W, SC = 4;
  // 1) medir
  const m = document.createElement('canvas'); m.width = 10; m.height = 10;
  const H = Math.ceil(await drawSheet(m.getContext('2d'), false));
  // 2) dibujar
  const cv = document.createElement('canvas'); cv.width = Math.round(W*SC); cv.height = Math.round(H*SC);
  const ctx = cv.getContext('2d'); ctx.scale(SC, SC); ctx.imageSmoothingQuality = 'high';
  await drawSheet(ctx, true);
  return cv;
}
const toBlob = (cv, type, q) => new Promise(res => cv.toBlob(res, type, q));

// PDF mínimo de una página con la imagen JPEG a página completa.
function pdfFromJpeg(jpg, wPx, hPx, title){
  const W = 300, H = +(W * hPx / wPx).toFixed(2);
  const enc = new TextEncoder(); const chunks = []; let len = 0; const offs = [];
  const add = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  const hex16 = s => { let h = 'FEFF'; for(const ch of s){ const cp = ch.codePointAt(0); if(cp > 0xFFFF){ const v = cp - 0x10000; h += (0xD800 + (v>>10)).toString(16).padStart(4,'0') + (0xDC00 + (v & 0x3FF)).toString(16).padStart(4,'0'); } else h += cp.toString(16).padStart(4,'0'); } return '<' + h.toUpperCase() + '>'; };
  const content = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
  add(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  const obj = (n, body) => { offs[n] = len; add(n + ' 0 obj\n'); body(); add('\nendobj\n'); };
  obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>'));
  obj(4, () => { add('<< /Type /XObject /Subtype /Image /Width ' + wPx + ' /Height ' + hPx + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n'); add(jpg); add('\nendstream'); });
  obj(5, () => add('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream'));
  obj(6, () => add('<< /Title ' + hex16(title) + ' /Creator (Ficha de parametros fotograficos) >>'));
  const xref = len;
  let x = 'xref\n0 7\n0000000000 65535 f \n';
  for(let i = 1; i <= 6; i++) x += String(offs[i]).padStart(10,'0') + ' 00000 n \n';
  add(x + 'trailer\n<< /Size 7 /Root 1 0 R /Info 6 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(chunks, {type:'application/pdf'});
}

function fileBase(){
  const n = (S.nombre || 'estudiante').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40) || 'estudiante';
  const d = new Date(); return 'Ficha_foto_' + n + '_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
async function saveFile(blob, name){
  const file = new File([blob], name, {type:blob.type});
  if(isMobile && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob); const a = el('a', {href:url, download:name});
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}

const modal = $('#modal'); let exp = null;
$('#bExport').addEventListener('click', async () => {
  closePop(); saveNow();
  if(!S.nombre){
    const n = $('#fNombre'); n.classList.add('bad'); $('#errNombre').hidden = false;
    n.scrollIntoView({behavior:'smooth', block:'center'}); n.focus({preventScroll:true});
    return;
  }
  $('#mMsg').textContent = 'Preparando…'; $('#mImg').removeAttribute('src'); modal.hidden = false;
  try{
    const cv = await buildCanvas();
    const png = await toBlob(cv, 'image/png');
    const jpgBlob = await toBlob(cv, 'image/jpeg', 0.9);
    const jpg = new Uint8Array(await jpgBlob.arrayBuffer());
    const pdf = pdfFromJpeg(jpg, cv.width, cv.height, 'Ficha fotográfica' + (S.nombre ? ' – ' + S.nombre : ''));
    if(exp && exp.url) URL.revokeObjectURL(exp.url);
    exp = {png, pdf, base:fileBase(), url:URL.createObjectURL(png)};
    $('#mImg').src = exp.url; $('#mMsg').textContent = '';
    logExport();
  }catch(e){ $('#mMsg').textContent = 'No se pudo generar la ficha (' + ((e && (e.name || e.message)) || 'error') + ').'; }
});
$('#mPng').addEventListener('click', () => { if(exp) saveFile(exp.png, exp.base + '.png'); });
$('#mPdf').addEventListener('click', () => { if(exp) saveFile(exp.pdf, exp.base + '.pdf'); });
$('#mClose').addEventListener('click', () => { modal.hidden = true; });
modal.addEventListener('click', e => { if(e.target === modal) modal.hidden = true; });

// Pre-cargar íconos para la exportación
['triangulo','estandarizacion', ...CAMARA.map(c => c.icon), ...COLS.map(c => c.icon)].forEach(loadIcon);
</script>
</body>
